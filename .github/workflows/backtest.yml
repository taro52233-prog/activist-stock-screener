name: backtest

on:
  workflow_dispatch:
    inputs:
      years:
        description: "検証する年数（例 3）"
        required: true
        default: "3"

permissions:
  contents: write

concurrency:
  group: daily-screening
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r pipeline/requirements.txt
      - name: Run backtest
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: python backtest/backtest.py --years ${{ github.event.inputs.years }}
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/backtest.html
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: backtest report (${{ github.event.inputs.years }}y)"
            git push
          fi
