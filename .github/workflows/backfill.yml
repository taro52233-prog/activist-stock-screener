name: backfill

on:
  workflow_dispatch:
    inputs:
      days:
        description: "遡る日数（例 180=約6ヶ月, 365=1年）"
        required: true
        default: "180"

permissions:
  contents: write

concurrency:
  group: daily-screening
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r pipeline/requirements.txt
      - name: Backfill known-activist filings
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: python pipeline/run.py --backfill ${{ github.event.inputs.days }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: backfill tracked filings (${{ github.event.inputs.days }}d)"
            git push
          fi
