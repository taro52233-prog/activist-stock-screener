<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>アクティビスト追随スクリーナー</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <header class="appbar" id="appbar"></header>
  <main class="wrap">
    <div id="banner"></div>

    <div class="card" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <strong style="font-size:.95rem">🔎 銘柄コードで開く</strong>
      <form id="codeForm" style="display:flex;gap:8px;flex-wrap:wrap">
        <input id="codeInput" list="codeList" placeholder="例: 7731 / 6302 / 7203" class="field"
               style="padding:8px 10px;min-width:180px" autocomplete="off" inputmode="numeric" />
        <datalist id="codeList"></datalist>
        <button class="btn" type="submit">開く</button>
      </form>
      <span class="muted" style="font-size:.8rem">※リストに無いコードも入力可。未取得なら監視リストに登録できます。</span>
    </div>

    <div id="ghSettings"></div>
    <div id="myWatch"></div>

    <section class="tiles" id="tiles"></section>

    <div class="card">
      <div class="filters">
        <label>最低スコア <span id="scoreVal">0</span>
          <input type="range" id="minScore" min="0" max="100" step="5" value="0" />
        </label>
        <label><input type="checkbox" id="onlyZone" /> 今が買いゾーンのみ</label>
        <label><input type="checkbox" id="onlyKnown" /> 既知アクティビストのみ</label>
        <label><input type="checkbox" id="onlyPbr" /> PBR&lt;1のみ</label>
        <label><input type="checkbox" id="onlyEntry" /> エントリー可のみ</label>
        <label><input type="checkbox" id="onlyWatch" /> ウォッチのみ</label>
      </div>
      <div class="table-scroll">
        <table id="tbl">
          <thead>
            <tr>
              <th class="l" data-k="star">★</th>
              <th data-k="buy">買い時</th>
              <th data-k="score">総合</th>
              <th class="l" data-k="code">コード</th>
              <th class="l" data-k="name">銘柄</th>
              <th class="l" data-k="fund">アクティビスト</th>
              <th data-k="holding_ratio">保有率</th>
              <th data-k="pbr">PBR</th>
              <th data-k="dividend_yield">利回り</th>
              <th data-k="deviation">提出日比</th>
              <th class="l" data-k="status">状態</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div id="emptyMsg"></div>
    </div>

    <section id="exits"></section>

    <p class="footer" id="footer"></p>
  </main>

  <script src="./js/app.js"></script>
  <script>
    let DATA = null, ROWS = [], sortKey = "buy", sortDir = -1;

    function deviation(c){ return c.derived.deviation_from_filing; }
    function buyScore(c){ return (c.signal && c.signal.buy_score) || 0; }
    function buyBadge(c){
      const s = buyScore(c);
      const col = s>=80?'var(--good)':s>=60?'var(--accent)':s>=40?'var(--warn)':'var(--text-muted)';
      const zone = c.signal && c.signal.buy_zone ? ' <span class="chip ok" style="padding:1px 5px">今</span>' : '';
      return `<span class="badge score-badge" style="background:${col}">${s}</span>${zone}`;
    }

    function passFilters(c){
      const minScore = +document.getElementById("minScore").value;
      if (c.signal.score < minScore) return false;
      if (document.getElementById("onlyZone").checked && !(c.signal && c.signal.buy_zone)) return false;
      if (document.getElementById("onlyKnown").checked && !c.activist.is_known) return false;
      if (document.getElementById("onlyPbr").checked && !(c.derived.pbr !== null && c.derived.pbr < 1)) return false;
      if (document.getElementById("onlyEntry").checked && !c.signal.filters.entry_ok) return false;
      if (document.getElementById("onlyWatch").checked && !isWatched(c.code)) return false;
      return true;
    }

    function sortRows(rows){
      const get = {
        buy: c=>buyScore(c),
        score: c=>c.signal.score, code: c=>c.code, name: c=>c.name, fund: c=>c.activist.fund,
        holding_ratio: c=>c.activist.holding_ratio||0, pbr: c=>c.derived.pbr??999,
        dividend_yield: c=>c.derived.dividend_yield??999, deviation: c=>deviation(c)??999,
        status: c=>c.status, star: c=>isWatched(c.code)?0:1,
      }[sortKey] || (c=>c.signal.score);
      return rows.slice().sort((a,b)=>{
        const va=get(a), vb=get(b);
        if (va<vb) return -1*sortDir; if (va>vb) return 1*sortDir; return 0;
      });
    }

    function render(){
      const rows = sortRows(ROWS.filter(passFilters));
      const tb = document.getElementById("tbody");
      tb.innerHTML = rows.map(c=>{
        const dev = deviation(c);
        const devTxt = dev===null? "—" : (dev<=0? `<span class="pl-pos">${fmtPct(dev)}</span>` : `+${fmtPct(dev)}`);
        return `<tr data-code="${c.code}">
          <td class="l"><span class="star ${isWatched(c.code)?'on':''}" data-star="${c.code}">${isWatched(c.code)?'★':'☆'}</span></td>
          <td>${buyBadge(c)}</td>
          <td>${scoreBadge(c.signal.score)}</td>
          <td class="l">${c.code}</td>
          <td class="l name">${c.name}</td>
          <td class="l">${c.activist.fund||'—'} ${c.activist.is_known?'<span class="chip known">既知</span>':''}</td>
          <td>${fmtPct(c.activist.holding_ratio)}</td>
          <td>${fmt2(c.derived.pbr)}</td>
          <td>${fmtPct(c.derived.dividend_yield)}</td>
          <td>${devTxt}</td>
          <td class="l">${statusChip(c.status)}</td>
        </tr>`;
      }).join("");
      document.getElementById("emptyMsg").innerHTML = rows.length? "" : `<div class="empty">条件に合う銘柄がありません。フィルタを緩めてください。</div>`;

      tb.querySelectorAll("tr").forEach(tr=>{
        tr.addEventListener("click", e=>{
          if (e.target.dataset.star!==undefined) return;
          location.href = "stock.html?code=" + tr.dataset.code;
        });
      });
      tb.querySelectorAll("[data-star]").forEach(s=>{
        s.addEventListener("click", e=>{ e.stopPropagation(); toggleWatch(s.dataset.star); render(); });
      });
    }

    function renderTiles(){
      const cs = ROWS;
      const trio = cs.filter(c=>c.signal && c.signal.buy_zone && c.activist.is_known && c.derived.pbr!=null && c.derived.pbr<1).length;
      const zone = cs.filter(c=>c.signal && c.signal.buy_zone).length;
      const known = cs.filter(c=>c.activist.is_known).length;
      const nu = cs.filter(c=>c.status==='NEW').length;
      document.getElementById("tiles").innerHTML = `
        ${tile("🎯 今が買い場", trio, "買いゾーン×既知×PBR&lt;1")}
        ${tile("買いゾーン内", zone, "今その水準にある銘柄")}
        ${tile("追跡中", cs.length, "大量保有を追跡中")}
        ${tile("既知アクティビスト", known, "著名ファンドが保有")}
        ${tile("本日の新規", nu, "前回から新登場")}`;
    }
    function tile(k,v,sub){ return `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="sub">${sub}</div></div>`; }

    function renderExits(){
      const ex = DATA.activist_exits||[];
      if(!ex.length){ document.getElementById("exits").innerHTML=""; return; }
      document.getElementById("exits").innerHTML = `
        <div class="section-title">⚠ アクティビスト撤退の可能性（出口検討）</div>
        <div class="card"><div class="table-scroll"><table>
          <thead><tr><th class="l">コード</th><th class="l">銘柄</th><th class="l">ファンド</th><th>前回</th><th>今回</th><th class="l">提出日</th></tr></thead>
          <tbody>${ex.map(e=>`<tr><td class="l">${e.code}</td><td class="l name">${e.name}</td><td class="l">${e.fund}</td><td>${fmtPct(e.prev_ratio)}</td><td><span class="pl-neg">${fmtPct(e.new_ratio)}</span></td><td class="l">${e.filing_date||'—'}</td></tr>`).join("")}</tbody>
        </table></div></div>`;
    }

    function bindFilters(){
      const ids=["onlyZone","onlyKnown","onlyPbr","onlyEntry","onlyWatch"];
      ids.forEach(id=>document.getElementById(id).addEventListener("change", render));
      const ms=document.getElementById("minScore");
      ms.addEventListener("input", ()=>{ document.getElementById("scoreVal").textContent=ms.value; render(); });
      document.querySelectorAll("#tbl thead th").forEach(th=>{
        th.addEventListener("click", ()=>{
          const k=th.dataset.k; if(k===sortKey) sortDir*=-1; else { sortKey=k; sortDir=(k==='code'||k==='name'||k==='fund'||k==='status')?1:-1; }
          render();
        });
      });
    }

    function bindCodeSearch(){
      const dl = document.getElementById("codeList");
      dl.innerHTML = ROWS.map(c=>`<option value="${c.code}">${c.code} ${c.name}</option>`).join("");
      document.getElementById("codeForm").addEventListener("submit", e=>{
        e.preventDefault();
        const raw = document.getElementById("codeInput").value.trim();
        const code = normCode(raw.split(/\s/)[0] || "");
        if (!code) return;
        // 追跡・監視の別を問わず開く。未取得コードは stock.html 側で登録パネルを表示。
        location.href = "stock.html?code=" + code;
      });
    }

    function renderGhSettings(){
      const box = document.getElementById("ghSettings");
      const on = ghConfigured();
      box.innerHTML = `<details class="card" ${on?'':'open'} style="padding:0">
        <summary style="cursor:pointer;padding:12px 14px;font-weight:600">
          ⚙ 自動反映（GitHub連携） ${on?'<span class="chip ok">設定済み</span>':'<span class="chip">未設定</span>'}
        </summary>
        <div style="padding:0 14px 14px">
          ${on ? `
            <p class="muted" style="font-size:.85rem">連携済みです。アプリで銘柄を<strong>登録／削除</strong>すると、
              <code>config/watchlist.txt</code> が自動更新され、翌営業日から自動取得されます。</p>
            <button class="btn" id="ghTest">接続テスト</button>
            <button class="linkbtn" id="ghClear" style="margin-left:12px">連携を解除（トークン削除）</button>
            <span class="muted" id="ghMsg" style="font-size:.8rem;margin-left:8px"></span>
          ` : `
            <p class="muted" style="font-size:.85rem;margin-top:4px">
              一度だけ設定すれば、以後アプリで登録するだけで自動反映されます。トークンは<strong>このブラウザ内だけ</strong>に保存され、他人からは見えません。
            </p>
            <ol class="muted" style="font-size:.82rem;padding-left:1.2em;margin:6px 0">
              <li>GitHubで <strong>fine-grained トークン</strong>を作成
                （<code>Settings → Developer settings → Fine-grained tokens → Generate</code>）</li>
              <li>Repository access＝<strong>このリポジトリのみ</strong>（${GH.owner}/${GH.repo}）</li>
              <li>Permissions＝<strong>Contents: Read and write</strong> を付与</li>
              <li>発行された <code>github_pat_...</code> を下に貼り付けて保存</li>
            </ol>
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
              <input id="ghToken" type="password" class="field" placeholder="github_pat_..." autocomplete="off"
                     style="padding:8px 10px;min-width:240px;flex:1" />
              <button class="btn" id="ghSave">保存して連携</button>
            </div>
            <div style="margin-top:6px"><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener" class="muted" style="font-size:.8rem">→ トークン作成ページを開く</a>
              <span class="muted" id="ghMsg" style="font-size:.8rem;margin-left:8px"></span></div>
          `}
        </div>
      </details>`;
      const save = document.getElementById("ghSave");
      if (save) save.addEventListener("click", async ()=>{
        const t = document.getElementById("ghToken").value.trim();
        if (!t){ document.getElementById("ghMsg").textContent="トークンを入力してください"; return; }
        setGhToken(t);
        document.getElementById("ghMsg").textContent="接続を確認中…";
        const ok = await ghTestConnection();
        if (!ok){ clearGhToken(); document.getElementById("ghMsg").textContent="⚠ 接続失敗。権限（Contents:RW）とリポジトリ指定を確認してください"; return; }
        renderGhSettings(); renderMyWatch();
      });
      const clear = document.getElementById("ghClear");
      if (clear) clear.addEventListener("click", ()=>{ clearGhToken(); renderGhSettings(); renderMyWatch(); });
      const test = document.getElementById("ghTest");
      if (test) test.addEventListener("click", async ()=>{
        document.getElementById("ghMsg").textContent="確認中…";
        document.getElementById("ghMsg").textContent = (await ghTestConnection()) ? "✅ 接続OK" : "⚠ 接続失敗（権限/リポジトリを確認）";
      });
    }

    async function ghTestConnection(){
      try {
        const r = await ghApi(`repos/${GH.owner}/${GH.repo}/contents/${GH.path}?ref=${GH.branch}`);
        return r.status === 200 || r.status === 404;
      } catch { return false; }
    }

    function renderMyWatch(){
      const codes = getVWatch();
      const box = document.getElementById("myWatch");
      if (!codes.length){ box.innerHTML = ""; return; }
      const byCode = {}; ROWS.forEach(c=>byCode[c.code]=c);
      const rows = codes.map(code=>{
        const c = byCode[code];
        const has = !!c;
        const status = has ? '<span class="chip ok">取得済み</span>' : '<span class="chip">取得待ち</span>';
        const nm = has ? (/^\(code /.test(c.name) ? `銘柄 ${c.code}` : c.name) : '';
        const info = has ? `${nm}${c.derived.pbr!=null?`｜PBR${fmt2(c.derived.pbr)}`:''}` : '<span class="muted">日次取得に載るとチャート・財務が表示されます</span>';
        return `<tr data-code="${code}"><td class="l">${code}</td><td class="l">${info}</td><td>${status}</td>
          <td class="l"><a href="stock.html?code=${code}">開く</a> <button class="linkbtn" data-del="${code}">削除</button></td></tr>`;
      }).join("");
      const linked = ghConfigured();
      const note = linked
        ? `GitHub連携済み：登録／削除は <code>config/watchlist.txt</code> に<strong>自動反映</strong>されます（翌営業日から自動取得）。`
        : `ブラウザに保存された監視コードです。<strong>毎日データを取得</strong>するには、上の「⚙ 自動反映」を設定するか、この一覧を <code>config/watchlist.txt</code> に反映してください。`;
      box.innerHTML = `<div class="section-title">👁 マイ監視リスト（${codes.length}件）</div>
        <div class="card">
          <p class="muted" style="font-size:.82rem;margin:0 0 10px">${note}</p>
          <div class="table-scroll"><table>
            <thead><tr><th class="l">コード</th><th class="l">銘柄 / 指標</th><th>状態</th><th class="l">操作</th></tr></thead>
            <tbody>${rows}</tbody>
          </table></div>
          <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            ${linked ? '' : '<button class="btn" id="copyWatch">📋 watchlist.txt 用にコピー</button>'}
            <span class="muted" id="copyMsg" style="font-size:.8rem"></span>
          </div>
        </div>`;
      box.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click", async ()=>{
        const msg = document.getElementById("copyMsg");
        if (linked && msg) msg.textContent = "反映中…";
        const r = await unregisterWatch(b.dataset.del);
        renderMyWatch();
        const m2 = document.getElementById("copyMsg"); if (linked && m2) m2.textContent = ghResultMsg(r);
      }));
      const cp = document.getElementById("copyWatch");
      if (cp) cp.addEventListener("click", async ()=>{
        const txt = getVWatch().join("\n") + "\n";
        try { await navigator.clipboard.writeText(txt); document.getElementById("copyMsg").textContent = "コピーしました"; }
        catch { document.getElementById("copyMsg").textContent = txt.replace(/\n/g," "); }
      });
    }

    (async ()=>{
      renderHeader("index.html");
      try {
        DATA = await loadData();
        ROWS = DATA.candidates || [];
        document.getElementById("banner").innerHTML = sampleBanner(DATA);
        renderTiles(); renderExits(); bindFilters(); bindCodeSearch(); renderGhSettings(); renderMyWatch(); render();
        document.getElementById("footer").textContent =
          `対象日 ${DATA.as_of_date}／生成 ${new Date(DATA.generated_at).toLocaleString("ja-JP")}`;
      } catch(err){
        document.getElementById("banner").innerHTML = `<div class="banner info">データを読み込めませんでした。日次パイプラインがまだ実行されていない可能性があります。（${err.message}）</div>`;
      }
    })();
  </script>
</body>
</html>
